[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electronics-sales-analysis"
version = "0.1.0"
description = "Reproducible cleaning and revenue analysis for an electronics sales dataset"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4,<5",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
]

[project.scripts]
electronics-sales = "electronics_sales.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
